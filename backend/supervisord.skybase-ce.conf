[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:shared_health_api]
command=/bin/sh -c 'exec uvicorn onyx.shared_supabase_health:app --host=0.0.0.0 --port="${PORT:-8080}"'
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
autorestart=unexpected
startsecs=10
stopasgroup=true
killasgroup=true

[program:celery_worker_docfetching]
command=celery -A onyx.background.celery.versioned_apps.docfetching worker --hostname=skybase-docfetching@%%h --concurrency=1 --pool=threads -Q connector_doc_fetching
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
autorestart=unexpected
startsecs=10
stopasgroup=true
killasgroup=true

[program:celery_worker_docprocessing]
command=celery -A onyx.background.celery.versioned_apps.docprocessing worker --hostname=skybase-docprocessing@%%h --concurrency=1 --pool=threads -Q docprocessing
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
autorestart=unexpected
startsecs=10
stopasgroup=true
killasgroup=true
